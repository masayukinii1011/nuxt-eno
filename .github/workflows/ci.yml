name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate static site
        run: npm run generate
        env:
          FIREBASE_API_KEY: placeholder
          FIREBASE_AUTH_DOMAIN: placeholder.firebaseapp.com
          FIREBASE_DATABASE_URL: https://placeholder.firebaseio.com
          FIREBASE_PROJECT_ID: placeholder
          FIREBASE_STORAGE_BUCKET: placeholder.appspot.com
          FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          FIREBASE_APP_ID: '1:000000000000:web:0000000000000000000000'

      - name: Lint
        run: npm run lint
